<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ruhaniya — Coming Soon</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      height:100vh;
      background:#F5EDE6;
      overflow:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      color:#2B2B2B;
    }

    /* Background Blur */
    .blur1,
    .blur2{
      position:absolute;
      border-radius:50%;
      filter:blur(120px);
      z-index:0;
    }

    .blur1{
      width:400px;
      height:400px;
      background:rgba(198,169,107,0.25);
      top:-100px;
      right:-80px;
    }

    .blur2{
      width:350px;
      height:350px;
      background:rgba(232,216,195,0.8);
      bottom:-100px;
      left:-80px;
    }

    /* Main Container */
    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:800px;
      padding:60px 40px;
      border-radius:30px;
      background:rgba(255,255,255,0.35);
      backdrop-filter:blur(18px);
      border:1px solid rgba(255,255,255,0.4);
      text-align:center;
      box-shadow:0 10px 40px rgba(0,0,0,0.08);
    }

    .logo{
      font-family:'Playfair Display',serif;
      font-size:52px;
      color:#C6A96B;
      margin-bottom:10px;
    }

    .tagline{
      letter-spacing:3px;
      font-size:12px;
      text-transform:uppercase;
      color:#8B7761;
      margin-bottom:40px;
    }

    h1{
      font-family:'Playfair Display',serif;
      font-size:64px;
      margin-bottom:20px;
      line-height:1.1;
    }

    p{
      max-width:600px;
      margin:auto;
      line-height:1.8;
      color:#555;
      margin-bottom:35px;
    }

    /* Button */
    .btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:14px 28px;
      border:none;
      border-radius:50px;
      background:#C6A96B;
      color:white;
      font-size:15px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      transform:translateY(-3px);
      background:#b59656;
    }

    /* Socials */
    .socials{
      margin-top:35px;
      display:flex;
      justify-content:center;
      gap:18px;
    }

    .socials a{
      width:42px;
      height:42px;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      text-decoration:none;
      color:#2B2B2B;
      background:white;
      transition:0.3s;
    }

    .socials a:hover{
      background:#C6A96B;
      color:white;
      transform:translateY(-4px);
    }

    /* Responsive */
    @media(max-width:768px){

      h1{
        font-size:42px;
      }

      .logo{
        font-size:40px;
      }

      .container{
        padding:45px 25px;
      }

    }

  </style>
</head>
<body>

  <div class="blur1"></div>
  <div class="blur2"></div>

  <div class="container">

    <div class="logo">Ruhaniya</div>

    <div class="tagline">
      Adorn Your Essence
    </div>

    <h1>We'er Coming Soon</h1>

    <p>
      Because "Jewellery isn't just an accessory...
      It's a feeling".
    </p>

    <button class="btn">
      <i class="fa-brands fa-instagram"></i>
      Follow Our Journey
    </button>

    <div class="socials">

      <a href="https://www.instagram.com/theruhaniyastore">
        <i class="fa-brands fa-instagram"></i>
      </a>

      <a href="https://www.facebook.com/share/1VrAM8vhvn/?mibextid=wwXIfr">
        <i class="fa-brands fa-facebook"></i>
      </a>

    </div>

  </div>

</body>
</html>
